# skrl PPO 训练配置（Find-the-Fruit）
# 观测是字典：rgb(256x256x5) / ee_position(3) / joints(6)，
# 因此网络分成三条分支（图像 CNN、末端位置 MLP、关节 MLP），最后拼接。
#
# [修改7] 2026-10-23 根据三次训练日志的调整：
#   日志显示学习率在前几次更新就被 KLAdaptiveLR 压到下限（94%~98% 的时间停在下限），
#   策略标准差几乎不变，训练后期策略损失爆炸到 1e8~1e17。
#   主因：CNN 展平后 86528 维直接接 512 全连接，Adam 每步的小改动在这层被放大，
#   学习率再小 KL 也超标。本次改动：
#   - CNN 后两层改为 stride 2、末层 64 通道，展平维度 86528 → 2304
#   - 去掉 KLAdaptiveLR，固定学习率；用 kl_threshold 做安全阀（KL 超标就提前结束本轮 epoch）
#   - separate: true，Actor / Critic 各用一套网络，价值损失不再干扰策略特征
#   - rollouts 32 → 64，配合 run_train.sh 默认 16 个环境，每次更新 1024 个样本
#   - time_limit_bootstrap: true，超时截断不再被当作真正的终止
seed: 42

models:
  # separate: true → Actor 和 Critic 各自独立构建，下面两段网络配置都会生效。
  separate: true

  # ---------------- Actor（策略网络）：输出 6 维动作的高斯分布 ----------------
  policy:
    class: GaussianMixin
    clip_actions: true        # 采样出的动作截断到动作空间范围 [-1, 1]
    clip_log_std: true        # 限制 log_std 范围，防止数值爆炸/塌缩
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: -0.5     # 初始 std ≈ 0.61
    network:
    # --- 分支 1：图像特征 ---
    # 输入 (N,256,256,5) → permute 成 (N,5,256,256)（PyTorch 的 NCHW 格式）。
    # [修改7] 卷积尺寸变化：256 → 63 → 30 → 14 → 6，flatten 为 64*6*6 = 2304 维
    #         （原为 128*26*26 = 86528 维）。
    - name: image_features
      input: permute(OBSERVATIONS['rgb'], (0, 3, 1, 2))
      layers:
      - conv2d:
          out_channels: 32
          kernel_size: 8
          stride: 4
          padding: 0
      - conv2d:
          out_channels: 64
          kernel_size: 4
          stride: 2
          padding: 0
      - conv2d:
          out_channels: 64
          kernel_size: 3
          stride: 2
          padding: 0
      - conv2d:
          out_channels: 64
          kernel_size: 3
          stride: 2
          padding: 0
      - flatten
      activations: elu
    # --- 分支 2：末端位置 (3,) → 两层 64 的 MLP ---
    - name: ee_features
      input: OBSERVATIONS['ee_position']
      layers:
      - 64
      - 64
      activations: elu
    # --- 分支 3：关节角度 (6,) → 两层 64 的 MLP ---
    - name: joint_features
      input: OBSERVATIONS['joints']
      layers:
      - 64
      - 64
      activations: elu
    # --- 融合：三路特征拼接后接 256 维全连接，再由 output 映射为动作均值 ---
    - name: combined
      input: concatenate([image_features, ee_features, joint_features])
      layers:
      - 256
      activations: elu
    output: ACTIONS

  # ---------------- Critic（价值网络）：输出标量状态价值 V(s) ----------------
  # separate: true 后这段配置真正生效，与 Actor 不共享参数。
  value:
    class: DeterministicMixin
    clip_actions: false
    network:
    - name: image_features
      input: permute(OBSERVATIONS['rgb'], (0, 3, 1, 2))
      layers:
      - conv2d:
          out_channels: 32
          kernel_size: 8
          stride: 4
          padding: 0
      - conv2d:
          out_channels: 64
          kernel_size: 4
          stride: 2
          padding: 0
      - conv2d:
          out_channels: 64
          kernel_size: 3
          stride: 2
          padding: 0
      - conv2d:
          out_channels: 64
          kernel_size: 3
          stride: 2
          padding: 0
      - flatten
      activations: elu
    - name: ee_features
      input: OBSERVATIONS['ee_position']
      layers:
      - 128
      - 128
      activations: elu
    - name: joint_features
      input: OBSERVATIONS['joints']
      layers:
      - 128
      - 128
      activations: elu
    - name: combined
      input: concatenate([image_features, ee_features, joint_features])
      layers:
      - 256
      activations: elu
    output: ONE               # 输出单个标量价值

# 经验缓冲：-1 表示容量自动等于 rollouts（on-policy，用完即弃）
memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: PPO
  rollouts: 64                # [修改7] 32→64；一次更新样本 = 64 × num_envs（16 环境时 1024）
  learning_epochs: 5          # 每批数据重复训练 5 个 epoch
  mini_batches: 4             # 16 环境时每个 mini-batch 256 个样本
  discount_factor: 0.99       # 折扣因子 γ
  lambda: 0.95                # GAE 的 λ
  # [修改7] 固定学习率，不再使用 KLAdaptiveLR（旧日志中它几乎全程把学习率压在下限）。
  # 训练时观察 "Learning / Learning rate" 应保持 1e-4 不变；
  # 若 "Loss / Policy loss" 仍出现 >1 的尖峰，可先降到 5e-5。
  learning_rate: 0.0001
  # 观测不做标准化：图像数值范围已在环境中处理好（rgb≈[-1,1]、掩码 0/1、深度 [0,1]）。
  state_preprocessor: null
  # 价值目标（回报）归一化，稳定 Critic 训练
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs:
    size: 1
    device: cuda:0
  random_timesteps: 0         # 开局纯随机探索步数（PPO 不需要）
  learning_starts: 0
  grad_norm_clip: 1.0         # 梯度裁剪
  ratio_clip: 0.2             # PPO 策略比值裁剪范围 ε
  value_clip: 0.2             # 价值函数裁剪范围（仅在 clip_predicted_values 为 true 时生效）
  clip_predicted_values: false
  entropy_loss_scale: 0.01    # 熵正则系数，鼓励探索
  value_loss_scale: 1.0       # [修改7] 2.0→1.0：网络已分开，价值损失不再需要额外加权
  # [修改7] KL 安全阀：某个 epoch 的 KL 超过 0.05 就提前结束本次更新，
  # 防止策略一步改动过大导致策略损失爆炸。0 表示关闭。
  kl_threshold: 0.05
  rewards_shaper_scale: 1.0   # 奖励不额外缩放
  time_limit_bootstrap: true  # [修改7] 超时截断时用价值估计做 bootstrap
  experiment:
    directory: "mybuddy_direct"   # 日志根目录：logs/skrl/mybuddy_direct
    experiment_name: ""
    write_interval: 100           # 每 100 步写一次 TensorBoard
    checkpoint_interval: 5000     # 每 5000 步存一次检查点
    wandb: False
    wandb_kwargs:
      project: "IsaacLab_Implementation"
      name: "mybuddy_direct_cluttered_background"

trainer:
  class: SequentialTrainer
  # 总时间步 400000；每个"迭代"= rollouts(64) 步，约 6250 次 PPO 更新。
  # train.py 的 --max_iterations 会把它覆盖为 max_iterations × rollouts。
  timesteps: 400000
  environment_info: log
  close_environment_at_exit: false
